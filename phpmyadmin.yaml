apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin
        env:
        - name: PMA_HOST
          value: "rc1a-3n06349v4fq1m8je.mdb.yandexcloud.net"
        - name: PMA_PORT
          value: "3306"
        - name: PMA_USER
          value: "netology_user"
        - name: PMA_PASSWORD
          value: "SecurePassword123!"
        - name: PMA_ARBITRARY
          value: "1"
        - name: PMA_SSL
          value: "1"
        - name: PMA_SSL_VERIFY
          value: "0"
        - name: PMA_SSL_CA
          value: ""
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin-service
spec:
  type: LoadBalancer
  selector:
    app: phpmyadmin
  ports:
  - port: 80
    targetPort: 80